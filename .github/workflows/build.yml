name: Build Quartz Client Mod
on:
  push:
    branches: ["quartz-mod-first-build"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Compile Quartz mod
        run: gradle -p quartz-mod build
      - uses: actions/upload-artifact@v4
        with:
          name: quartz-client-mod-1.21.11
          path: quartz-mod/build/libs/quartz-client-mod-*.jar
