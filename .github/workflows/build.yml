name: Build Quartz Client Mod
on:
  push:
    branches: ["quartz-mod-first-build"]
  workflow_dispatch:
jobs:
  build-mod:
    strategy:
      fail-fast: false
      matrix:
        target:
          - { id: "1.21.11", project: "quartz-mod" }
          - { id: "26.3", project: "quartz-mod-26.3" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Compile Quartz mod
        run: gradle -p ${{ matrix.target.project }} build
      - uses: actions/upload-artifact@v4
        with:
          name: quartz-client-mod-${{ matrix.target.id }}
          path: ${{ matrix.target.project }}/build/libs/quartz-client-mod-*.jar
