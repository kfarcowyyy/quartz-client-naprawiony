name: Build Quartz Client
on:
  push:
    branches: ["quartz-mod-first-build"]
  pull_request:
  workflow_dispatch:
jobs:
  build-mod:
    strategy:
      fail-fast: false
      matrix:
        target:
          - { id: "1.21.11", project: "quartz-mod" }
          - { id: "26.3", project: "quartz-mod-26.3" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Compile Quartz mod
        run: gradle -p ${{ matrix.target.project }} build
      - name: Stage the runtime mod JAR
        shell: bash
        run: |
          mkdir -p dist
          jar=$(find "${{ matrix.target.project }}/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          test -n "$jar"
          jar tf "$jar" > dist/jar-entries.txt
          grep -Fx 'com/quartz/client/QuartzModClient.class' dist/jar-entries.txt
          grep -Fx 'com/quartz/network/QuartzWardrobeSync.class' dist/jar-entries.txt
          grep -Fx 'assets/quartz/textures/wardrobe/cape-crystal.png' dist/jar-entries.txt
          grep -Fx 'fabric.mod.json' dist/jar-entries.txt
          cp "$jar" "dist/Quartz-Client-Mod-${{ matrix.target.id }}.jar"
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: quartz-client-mod-${{ matrix.target.id }}
          path: dist/*.jar
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    needs: build-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: quartz-client-mod-1.21.11
          path: quartz-mods/fabric/1.21.11
      - uses: actions/download-artifact@v4
        with:
          name: quartz-client-mod-26.3
          path: quartz-mods/fabric/26.3
      - name: Bundle Fabric builds and their dependencies
        shell: bash
        run: |
          stage() {
            local mc="$1" api="$2" folder="quartz-mods/fabric/$1"
            mv "$folder/Quartz-Client-Mod-$mc.jar" "$folder/quartz-client.jar"
            curl --fail --location --retry 3 "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$api/fabric-api-$api.jar" -o "$folder/fabric-api.jar"
          }
          stage '1.21.11' '0.141.6+1.21.11'
          stage '26.3' '0.166.2+26.3'
      - run: npm install --no-audit --no-fund
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Quartz-Client-Windows
          path: dist/Quartz-Client-*.exe
          if-no-files-found: error
