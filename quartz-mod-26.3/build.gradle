plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        "quartz" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Native-free image decoder for WebP project assets from Modrinth.
    def imageVersion = "3.15.3"
    implementation "com.twelvemonkeys.imageio:imageio-webp:${imageVersion}"
    ["imageio-webp", "imageio-core", "imageio-metadata"].each {
        include "com.twelvemonkeys.imageio:${it}:${imageVersion}"
    }
    ["common-lang", "common-io", "common-image"].each {
        include "com.twelvemonkeys.common:${it}:${imageVersion}"
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
